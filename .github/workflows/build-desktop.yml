name: Build Desktop Application

on:
  push:
    branches:
      - master
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*'
      - 'desktop-v*'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Publish installers to a draft GitHub Release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  NODE_VERSION: '24'

jobs:
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages and web frontend
        run: pnpm run build

      - name: Build Desktop app scripts
        run: pnpm --filter @deepseek-ai/dsh-desktop run build

      - name: Package Windows installers (.exe and .msi)
        run: pnpm --filter @deepseek-ai/dsh-desktop run build:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: |
            apps/desktop/dist-installer/*.exe
            apps/desktop/dist-installer/*.msi
          if-no-files-found: error

      - name: Create Release / Upload Assets
        if: startsWith(github.ref, 'refs/tags/') || inputs.draft_release == true
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft_release || false }}
          prerelease: false
          files: |
            apps/desktop/dist-installer/*.exe
            apps/desktop/dist-installer/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
