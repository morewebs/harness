appId: com.morewebs.harness
productName: moreweb Desktop
copyright: Copyright © 2026 moreweb

afterPack: scripts/after-pack.cjs

asar: false

npmRebuild: false
nodeGypRebuild: false

publish:
  provider: github
  owner: morewebs
  repo: harness

directories:
  output: dist-installer
  buildResources: build

files:
  - dist/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
  - '!**/node_modules/@deepseek-ai/*/node_modules/**'
  - '!**/node_modules/**/*.map'
  - '!**/node_modules/**/*.ts'
  - '!**/node_modules/**/*.md'

extraResources:
  - from: build/bin
    to: bin
    filter:
      - '**/*'
  - from: ../web/dist
    to: web-dist
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: moreweb Desktop
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: moreweb Desktop
  runAfterFinish: true

msi:
  oneClick: false
  perMachine: true
  runAfterFinish: false
