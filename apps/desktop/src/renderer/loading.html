<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>moreweb Desktop</title>
  <link rel="preload" href="./fonts/poppins-100.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 100;
      font-display: swap;
      src: url('./fonts/poppins-100.woff2') format('woff2');
    }

    body {
      background-color: #000000;
      height: 100vh;
      overflow: hidden;
    }

    /* Splash Screen Container — also the loading page */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(1.5rem, 4vh, 3rem);
    }

    /* Word Grid Layout */
    .splash-screen .word {
      color: #FFFFFF;
      font-family: 'Poppins', sans-serif;
      font-weight: 100;
      font-size: clamp(8rem, 15vw, 10rem);
      display: grid;
      grid-template-columns: auto auto;
      justify-items: center;
      line-height: 0.8;
      gap: 0.15em;
      text-shadow: 0 0 30px #bf00ff;
      direction: ltr;
    }

    .splash-screen .word span {
      opacity: 0;
      position: relative;
    }

    /* Staggered Letter Animations */
    .splash-screen .word span:nth-child(1) { animation: letterAppear 0.3s ease-out 0.0s forwards; }
    .splash-screen .word span:nth-child(2) { animation: letterAppear 0.3s ease-out 0.1s forwards; }
    .splash-screen .word span:nth-child(3) { animation: letterAppear 0.3s ease-out 0.2s forwards; }
    .splash-screen .word span:nth-child(4) { animation: letterAppear 0.3s ease-out 0.3s forwards; }

    @keyframes letterAppear {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Loading status area */
    .status {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
      min-height: 18px;
      max-width: 80vw;
      opacity: 0;
      animation: statusAppear 0.4s ease-out 0.5s forwards;
    }

    .status:empty {
      display: none;
    }

    @keyframes statusAppear {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Thin progress bar instead of a spinner, to match the minimal word mark */
    .progress {
      position: relative;
      width: clamp(120px, 18vw, 220px);
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      opacity: 0;
      animation: statusAppear 0.4s ease-out 0.6s forwards;
    }

    .progress::after {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #bf00ff, transparent);
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      from { left: -40%; }
      to   { left: 100%; }
    }

    /* Error view */
    .error-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      max-width: min(480px, 86vw);
      text-align: center;
    }

    .error-view.visible {
      display: flex;
      animation: statusAppear 0.3s ease-out forwards;
    }

    .error-badge {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ff7ab8;
      text-shadow: 0 0 18px rgba(255, 0, 110, 0.45);
    }

    .error-details {
      font-size: 12px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.45);
      word-break: break-word;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid rgba(191, 0, 255, 0.6);
      box-shadow: 0 0 18px rgba(191, 0, 255, 0.25);
    }

    .btn-primary:hover {
      border-color: #bf00ff;
      box-shadow: 0 0 26px rgba(191, 0, 255, 0.45);
    }

    .btn-secondary {
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* Exit animation — fired when the backend reports ready, then main process navigates */
    .splash-screen.leaving .word {
      animation: fadeWordOut 0.35s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
    }

    .splash-screen.leaving .status,
    .splash-screen.leaving .progress {
      animation: fadeWordOut 0.3s ease-in forwards;
    }

    @keyframes fadeWordOut {
      from {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
      to {
        opacity: 0;
        transform: scale(1.1);
        filter: blur(10px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-screen .word span,
      .status,
      .progress {
        animation-duration: 0.01s;
        animation-delay: 0s;
      }
      .progress::after {
        animation: none;
        left: 0;
        width: 100%;
      }
    }
    /* Top window controls bar for frameless desktop window */
    .window-titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      z-index: 100000;
      -webkit-app-region: drag;
      app-region: drag;
      user-select: none;
    }

    .window-drag-region {
      flex: 1;
      height: 100%;
      -webkit-app-region: drag;
      app-region: drag;
    }

    .window-controls {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
      app-region: no-drag;
      flex: none;
    }

    .control-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 100%;
      border: none;
      background: transparent;
      color: #cccccc;
      cursor: pointer;
      transition: background-color 80ms ease, color 80ms ease;
      -webkit-app-region: no-drag;
      padding: 0;
    }

    .control-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .close-btn:hover {
      background-color: #e81123 !important;
      color: #ffffff !important;
    }

    .close-btn:active {
      background-color: #c40e1d !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>

<div class="window-titlebar" id="windowTitlebar">
  <div class="window-drag-region" id="dragRegion"></div>
  <div class="window-controls" aria-label="Window Controls">
    <button type="button" class="control-btn" id="minBtn" title="Minimize" aria-label="Minimize">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
      </svg>
    </button>
    <button type="button" class="control-btn" id="maxBtn" title="Maximize" aria-label="Maximize">
      <svg id="maxIcon" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="8" height="8" stroke="currentColor" stroke-width="1" />
      </svg>
    </button>
    <button type="button" class="control-btn close-btn" id="closeBtn" title="Close" aria-label="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
      </svg>
    </button>
  </div>
</div>

<div class="splash-screen" id="splashScreen">
  <div class="word">
    <span>m</span><span>o</span><span>r</span><span>e</span>
  </div>

  <div id="progress" class="progress"></div>
  <div id="statusMessage" class="status"></div>

  <div id="errorView" class="error-view">
    <div class="error-badge">Backend Launch Failed</div>
    <div id="errorDetails" class="error-details"></div>
    <div class="button-group">
      <button id="retryBtn" class="btn btn-primary">Retry</button>
      <button id="logsBtn" class="btn btn-secondary">Open Logs</button>
    </div>
  </div>
</div>

<script>
  const splashScreen = document.getElementById('splashScreen');
  const statusMessage = document.getElementById('statusMessage');
  const progress = document.getElementById('progress');
  const errorView = document.getElementById('errorView');
  const errorDetails = document.getElementById('errorDetails');
  const retryBtn = document.getElementById('retryBtn');
  const logsBtn = document.getElementById('logsBtn');

  function showLoading(message) {
    splashScreen.classList.remove('leaving');
    progress.style.display = 'block';
    errorView.classList.remove('visible');
    statusMessage.textContent = message || '';
  }

  function showError(message) {
    progress.style.display = 'none';
    errorView.classList.add('visible');
    statusMessage.textContent = 'Could not start backend service.';
    errorDetails.textContent = message;
  }

  if (window.desktopAPI) {
    window.desktopAPI.onServerStatus((status) => {
      if (status.state === 'starting') {
        showLoading();
      } else if (status.state === 'running') {
        // Play the blur-out, then main process swaps to the web app URL.
        splashScreen.classList.add('leaving');
      } else if (status.state === 'error') {
        showError(status.message || 'Unknown error occurred.');
      }
    });

    retryBtn.addEventListener('click', () => {
      showLoading('Restarting server...');
      window.desktopAPI.restartServer();
    });

    logsBtn.addEventListener('click', () => {
      window.desktopAPI.openLogFolder();
    });

    // Window controls
    const minBtn = document.getElementById('minBtn');
    const maxBtn = document.getElementById('maxBtn');
    const closeBtn = document.getElementById('closeBtn');
    const maxIcon = document.getElementById('maxIcon');
    const dragRegion = document.getElementById('dragRegion');

    function updateMaxIcon(isMax) {
      if (isMax) {
        maxIcon.innerHTML = '<rect x="2.5" y="0.5" width="7" height="7" stroke="currentColor" stroke-width="1" /><path d="M0.5 2.5V9.5H7.5" stroke="currentColor" stroke-width="1" />';
        maxBtn.title = 'Restore';
        maxBtn.setAttribute('aria-label', 'Restore');
      } else {
        maxIcon.innerHTML = '<rect x="1" y="1" width="8" height="8" stroke="currentColor" stroke-width="1" />';
        maxBtn.title = 'Maximize';
        maxBtn.setAttribute('aria-label', 'Maximize');
      }
    }

    minBtn.addEventListener('click', () => {
      void window.desktopAPI.minimize?.();
    });

    maxBtn.addEventListener('click', async () => {
      const isMax = await window.desktopAPI.maximize?.();
      updateMaxIcon(Boolean(isMax));
    });

    closeBtn.addEventListener('click', () => {
      void window.desktopAPI.close?.();
    });

    dragRegion?.addEventListener('dblclick', () => {
      void window.desktopAPI.maximize?.().then((max) => updateMaxIcon(Boolean(max)));
    });

    void window.desktopAPI.isMaximized?.().then((max) => updateMaxIcon(Boolean(max)));
    window.desktopAPI.onMaximizedChange?.(updateMaxIcon);
  } else {
    const closeBtn = document.getElementById('closeBtn');
    closeBtn?.addEventListener('click', () => {
      window.close();
    });
    showError('Preload bridge is unavailable. Please restart the application or reinstall.');
    statusMessage.textContent = 'Desktop API initialization error';
  }
</script>

</body>
</html>
